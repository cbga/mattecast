[project]
name = "mattecast"
version = "0.3.0"
description = "Studio-quality virtual backgrounds computed on a spare NVIDIA GPU and sent to any computer as a plain webcam over HDMI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=1.24",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "pygame>=2.5",
  # Runtime imports of the MatAnyone 2 source (fetched on first run, see models.py)
  "omegaconf>=2.3",
  "huggingface_hub>=0.24",
  "imageio>=2.25",
  "tqdm>=4.60",
  "requests>=2.28",
]

[project.optional-dependencies]
v4l2 = ["pyvirtualcam>=0.12"]

[project.scripts]
mattecast = "mattecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattecast"]

# CUDA 12.8 wheels are the first ones with RTX 50 (Blackwell) kernels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
